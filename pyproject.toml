[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magenta"
version = "0.1.0"
description = "Agentic System Orchestration Automation and Response (ASOAR) framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Magenta Team"},
]

dependencies = [
    "typer>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.3",
    "httpx>=0.26.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "aiosqlite>=0.19.0",
    "elasticsearch[async]>=9.4.1",
    "adlfs>=2026.5.0",
    "pyarrow>=15.0.0",
    "deltalake>=1.6.2",
    "azure-identity>=1.15.0",
    "azure-monitor-opentelemetry>=1.0.0",
    "azure-storage-blob>=12.19.0",
    "azure-eventhub>=5.15.1",
    "azure-eventhub-checkpointstoreblob-aio>=1.1.0",
    "kafka-python>=2.0.2",
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "chromadb>=0.4.22",
    "openai>=1.12.0",
    "tomli>=2.0.0",
    "python-multipart>=0.0.32",
    "pyjwt>=2.8.0",
    "python-dateutil>=2.8.0",
    "tabulate>=0.10.0",
    "langgraph>=1.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "httpx>=0.26.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]

# Phase 2 — Cloud connector dependencies
aws = [
    "aioboto3>=12.0.0",
    "boto3>=1.34.0",
]
gcp = [
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-logging>=3.10.0",
]

# Phase 3 — Endpoint collector dependencies
collectors = [
    "paramiko>=3.4.0",
    "pywinrm>=0.5.0",
    "cryptography>=42.0.0",
]

finops = ["prophet>=1.1.0"]

[project.scripts]
magenta = "magenta.main:app"

[tool.hatch.build.targets.wheel]
packages = ["magenta"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length — enforced by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["magnet"]
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
markers = [
    "api: tests for API endpoints",
    "cli: tests for CLI commands",
    "core: tests for framework core logic",
    "agents: tests for agent implementations",
]
