name: Terraform CI

on:
  pull_request:
    paths:
      - 'soa/terraform/**'
      - 'soa/config/**'
  push:
    branches: [main, staging]
    paths:
      - 'soa/terraform/**'
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC — drift detection

env:
  TF_VERSION: 1.10.0
  TF_DIR: soa/terraform
  INFRACOST_VERSION: 0.10.39

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.TF_DIR }}

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ env.TF_DIR }}

      - name: Terraform Plan (${{ matrix.environment }})
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.environment }}/terraform.tfvars" \
            -out=tfplan-${{ matrix.environment }} \
            -no-color 2>&1 | tee plan-${{ matrix.environment }}.txt
        working-directory: ${{ env.TF_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: ${{ env.TF_DIR }}/tfplan-${{ matrix.environment }}

      - name: Post Plan Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan-${{ matrix.environment }}.txt', 'utf8');
            const summary = plan.split('\n').filter(l => l.match(/^(Plan:|No changes|Error)/)).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan — ${{ matrix.environment }}\n\`\`\`\n${summary || plan.slice(0, 1000)}\n\`\`\``
            });

  infracost:
    name: Infracost
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: ./.github/actions/infracost-setup
        with:
          infracost_version: ${{ env.INFRACOST_VERSION }}

      - name: Generate Infracost JSON
        run: |
          infracost breakdown --path=. \
            --terraform-var-file="environments/staging/terraform.tfvars" \
            --format=json \
            --out-file=/tmp/infracost.json
        working-directory: ${{ env.TF_DIR }}

      - name: Post Infracost Comment
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behaviors: update

  drift-detect:
    name: Drift Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        environment: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_DIR }}/environments/${{ matrix.environment }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      - name: Terraform Plan (Drift Check)
        id: drift
        run: |
          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift-report.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        working-directory: ${{ env.TF_DIR }}/environments/${{ matrix.environment }}
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      - name: Notify on Drift
        if: steps.drift.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Terraform Drift Detected — ${{ matrix.environment }}',
              body: 'Drift detected in **${{ matrix.environment }}** environment. Run `terraform plan` locally to review changes.',
              labels: ['drift', 'infrastructure']
            });
