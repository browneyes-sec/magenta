# Qdrant Vector Database — StatefulSet
# Serves all data product collections for the Magenta Data Mesh.
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: magenta-mesh
  labels:
    app: qdrant
    component: vector-store
spec:
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
  selector:
    app: qdrant
  clusterIP: None  # headless for StatefulSet identity
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: magenta-mesh
  labels:
    app: qdrant
    component: vector-store
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        component: vector-store
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: configure-collections
          image: qdrant/qdrant:v1.12.0
          command:
            - sh
            - -c
            - |
              # Wait for Qdrant to be ready
              until curl -sf http://localhost:6333/healthz; do sleep 2; done
              
              # Create collections with HNSW config per data mesh spec
              for collection in siem_alerts mem_episodic mem_semantic mem_procedural; do
                echo "Creating collection: $collection"
                curl -X PUT "http://localhost:6333/collections/$collection" \
                  -H "Content-Type: application/json" \
                  -d @/config/collections/${collection}.json || echo "Collection $collection may already exist"
              done
          volumeMounts:
            - name: collection-configs
              mountPath: /config/collections
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.0
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
        - name: collection-configs
          configMap:
            name: qdrant-collection-configs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: magenta-mesh
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard