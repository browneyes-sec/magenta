apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://magenta-prometheus:9090
    isDefault: true
    editable: false
    uid: magenta-prometheus

  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://magenta-influxdb:8086
    isDefault: false
    editable: false
    uid: magenta-influxdb
    jsonData:
      version: Flux
      organization: magenta
      defaultBucket: magenta
      tlsSkipVerify: true
    secureJsonData:
      token: "${INFLUXDB_TOKEN:-magenta-token}"

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://magenta-elasticsearch:9200
    isDefault: false
    editable: false
    uid: magenta-elastic
    jsonData:
      timeField: logged_at
      esVersion: 8.0.0
      maxConcurrentShardRequests: 5
