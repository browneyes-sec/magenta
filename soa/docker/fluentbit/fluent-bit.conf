# Fluent Bit Configuration — Magenta Linux Log Collector
# Deployed on Linux log aggregators to forward syslog to Magenta ingest API.
# https://docs.fluentbit.io/manual/pipeline/outputs/http

[SERVICE]
    flush           5
    log_level       ${FLUENT_LOG_LEVEL:-info}
    parsers_file    /etc/fluent-bit/parsers.conf

[INPUT]
    name            tail
    path            /var/log/syslog
    path_key        logfile
    tag             syslog
    parser          syslog-rfc5424
    read_from_head  false
    db              /var/log/flb_syslog.db

[INPUT]
    name            tail
    path            /var/log/auth.log
    path_key        logfile
    tag             auth
    parser          syslog-rfc3164
    read_from_head  false
    db              /var/log/flb_auth.db

[INPUT]
    name            systemd
    tag             journald
    systemd_filter  _SYSTEMD_UNIT=ssh.service
    systemd_filter  _SYSTEMD_UNIT=sshd.service
    systemd_filter  _SYSTEMD_UNIT=sudo.service

[FILTER]
    name            record_modifier
    match           *
    record          source_host ${HOSTNAME}
    record          source_system linux_syslog

[OUTPUT]
    name            http
    match           *
    host            ${MAGENTA_INGEST_HOST:-ingest.magenta.local}
    port            ${MAGENTA_INGEST_PORT:-443}
    uri             /ingest/v1/events
    format          json
    header          Content-Type application/json
    header          X-Magenta-Source linux-fluentbit
    header          X-Source-Host ${HOSTNAME}
    tls             on
    tls.verify      ${MAGENTA_TLS_VERIFY:-on}
    tls.ca_file     /etc/fluent-bit/certs/ca.pem
    tls.crt_file    /etc/fluent-bit/certs/client.crt
    tls.key_file    /etc/fluent-bit/certs/client.key
    retry_limit     5
    net.connect_timeout 10
    net.read_timeout     30
