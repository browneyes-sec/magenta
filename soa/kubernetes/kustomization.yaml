# Magenta SOA — Top-Level Kustomization
# Apply: kubectl apply -k soa/kubernetes/
# Deploy: ./soa/kubernetes/minikube/start.sh

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: magenta-soa

resources:
  - namespaces/magenta-soa.yaml
  - mcp-services/mcp-bridge.yaml
  - agents/agent-ops.yaml

commonLabels:
  app.kubernetes.io/name: magenta
  app.kubernetes.io/component: soa
  app.kubernetes.io/part-of: magenta-asoar
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: soa-config
    files:
      - config/system.toml
      - config/providers.toml
      - config/agents.toml
      - config/multicloud.toml
      - config/finops.toml
  - name: terraform-modules
    files:
      - terraform/main.tf
      - terraform/providers.tf
      - terraform/modules/compute/main.tf
      - terraform/modules/kubernetes/main.tf

secretGenerator:
  - name: mcp-tls
    type: kubernetes.io/tls
    files:
      - tls.crt=secrets/mcp-tls.crt
      - tls.key=secrets/mcp-tls.key
  - name: cloud-credentials
    envs:
      - secrets/cloud-credentials.env
    type: Opaque

images:
  - name: magenta/mcp-bridge
    newTag: 0.1.0
  - name: magenta/agent-ops
    newTag: 0.1.0
