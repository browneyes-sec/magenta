# Magenta Scheduler — Cron scheduler for playbooks, collectors, maintenance
apiVersion: apps/v1
kind: Deployment
metadata:
  name: magenta-scheduler
  namespace: magenta-soa
  labels:
    app: magenta-scheduler
    role: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magenta-scheduler
  template:
    metadata:
      labels:
        app: magenta-scheduler
        role: scheduler
    spec:
      serviceAccountName: magenta-scheduler-sa
      containers:
        - name: scheduler
          image: magenta/scheduler:0.1.0
          ports:
            - containerPort: 9090
              name: metrics
          env:
            - name: MAGENTA_ENV
              value: "staging"
            - name: MAGENTA_SQL__URL
              valueFrom:
                secretKeyRef:
                  name: magenta-secrets
                  key: sql-url
            - name: MAGENTA_ELASTIC__HOSTS
              value: "http://magenta-elasticsearch:9200"
            - name: MAGENTA_REDIS_URL
              value: "redis://magenta-redis:6379/0"
            - name: MAGENTA_EVENTHUB__CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: magenta-secrets
                  key: eventhub-connection-string
            - name: MAGENTA_AZURE_AUTH__USE_DEFAULT_CREDENTIAL
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import magenta.orchestration.scheduler; print('OK')"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["python", "-c", "import magenta.orchestration.scheduler; print('OK')"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: soa-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: magenta-scheduler-sa
  namespace: magenta-soa
  annotations:
    azure.workload.identity/client-id: "${MAGENTA_SCHEDULER_CLIENT_ID}"