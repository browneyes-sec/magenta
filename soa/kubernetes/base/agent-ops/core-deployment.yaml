# Agent Ops Core Deployment
# Deploys the core Agent Ops MCP server (no Terraform).
# Terraform operations are handled by the sidecar pod.
#
# Build: docker build -t magenta/agent-ops:latest -f soa/docker/Dockerfile.agent-ops .
# Size: ~150MB (distroless base + app)
#
# K8s: Deploy with sidecar for Terraform operations.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ops-core
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-ops
      app.kubernetes.io/component: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-ops
        app.kubernetes.io/component: core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: agent-ops
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: agent-ops
          image: ghcr.io/browneyes-sec/magenta/agent-ops:latest
          ports:
            - containerPort: 50060
              name: grpc
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: MAGENTA_ENV
              valueFrom:
                configMapKeyRef:
                  name: agent-ops-config
                  key: MAGENTA_ENV
            - name: MAGENTA_SQL__URL
              valueFrom:
                secretKeyRef:
                  name: agent-ops-secrets
                  key: MAGENTA_SQL__URL
            - name: MAGENTA_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: agent-ops-secrets
                  key: MAGENTA_REDIS_URL
            - name: MAGENTA_LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: agent-ops-config
              mountPath: /app/config
              readOnly: true
            - name: terraform-state
              mountPath: /tmp/terraform
            - name: agent-ops-data
              mountPath: /app/data
          livenessProbe:
            grpc:
              port: 50060
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            grpc:
              port: 50060
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: agent-ops-config
          configMap:
            name: agent-ops-config
        - name: terraform-state
          emptyDir:
            sizeLimit: 1Gi
        - name: agent-ops-data
          persistentVolumeClaim:
            claimName: agent-ops-data
---
apiVersion: v1
kind: Service
metadata:
  name: agent-ops-core
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
spec:
  type: ClusterIP
  ports:
    - port: 50060
      targetPort: 50060
      protocol: TCP
      name: grpc
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-ops
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-ops-config
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
data:
  MAGENTA_ENV: "production"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-ops-secrets
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
type: Opaque
stringData:
  MAGENTA_SQL__URL: "sqlite+aiosqlite:///data/magenta.db"
  MAGENTA_REDIS_URL: "redis://magenta-redis:6379/0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-ops-data
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: managed-csi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-ops-core
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-ops
      app.kubernetes.io/component: core
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agent-ops-core
  namespace: magenta-agents
  labels:
    app.kubernetes.io/name: agent-ops
    app.kubernetes.io/component: core
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-ops
      app.kubernetes.io/component: core
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
