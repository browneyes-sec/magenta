# MCP Bridge Allow Rules
# Allows ingress to MCP Bridge from agents and egress to all MCP services.
# See ADR-002 for MCP service integration protocol.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-bridge-ingress
  namespace: magenta-soa
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: mcp-bridge
    app.kubernetes.io/managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-bridge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: magenta
              app.kubernetes.io/component: agents
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-bridge-egress
  namespace: magenta-soa
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: mcp-bridge
    app.kubernetes.io/managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-bridge
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow MCP services
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: magenta
      ports:
        - protocol: TCP
          port: 50051
        - protocol: TCP
          port: 50052
        - protocol: TCP
          port: 50053
        - protocol: TCP
          port: 50054
        - protocol: TCP
          port: 50060
        - protocol: TCP
          port: 50061
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Allow Redis
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: magenta-mesh
      ports:
        - protocol: TCP
          port: 6379
    # Allow Qdrant
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: magenta-mesh
      ports:
        - protocol: TCP
          port: 6333
        - protocol: TCP
          port: 6334
    # Allow OLLAMA
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: magenta-mesh
      ports:
        - protocol: TCP
          port: 11434
