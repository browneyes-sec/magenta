apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: magenta-dev
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: collector
          env:
            - name: MAGENTA_ENV
              value: "dev"
            - name: MAGENTA_LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "150m"
              memory: "192Mi"
            limits:
              cpu: "300m"
              memory: "384Mi"
