apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ops-core
  namespace: magenta-dev
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: agent-ops
          env:
            - name: MAGENTA_ENV
              value: "dev"
            - name: MAGENTA_LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ops-tf-sidecar
  namespace: magenta-dev
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: tf-sidecar
          env:
            - name: MAGENTA_ENV
              value: "dev"
            - name: MAGENTA_LOG_LEVEL
              value: "DEBUG"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
