apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: magenta-production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: collector
      containers:
        - name: collector
          env:
            - name: MAGENTA_ENV
              value: "production"
            - name: MAGENTA_LOG_LEVEL
              value: "WARN"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
