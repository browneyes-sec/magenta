# Staging Overlay — 2 replicas, staging tags, moderate resources

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: mcp-bridge
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: agent-ops
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: agent-orchestrator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: mcp-web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: mcp-finops
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: PersistentVolumeClaim
      name: terraform-state-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "10Gi"
  - target:
      kind: PersistentVolumeClaim
      name: orchestrator-state-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "10Gi"

images:
  - name: magenta/mcp-bridge
    newTag: staging
  - name: magenta/agent-ops
    newTag: staging
  - name: magenta/agent-orchestrator
    newTag: staging
  - name: magenta/mcp-web
    newTag: staging
  - name: magenta/mcp-finops
    newTag: staging
