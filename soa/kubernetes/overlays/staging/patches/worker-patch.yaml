apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: magenta-staging
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: MAGENTA_ENV
              value: "staging"
            - name: MAGENTA_LOG_LEVEL
              value: "INFO"
            - name: MAGENTA_WORKER__CONCURRENCY
              value: "5"
            - name: MAGENTA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: magenta-secrets
                  key: api-key
            - name: MAGENTA_REDIS_PERSISTENCE
              value: "true"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
