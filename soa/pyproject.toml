[project]
name = "magenta-soa"
version = "0.1.0"
description = "Magenta ASOAR — Service-Oriented Architecture for MCP"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Magenta Contributors" },
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "grpcio>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "tomli>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
terraform = [
    "python-terraform>=0.10.0",
]
azure = [
    "azure-identity>=1.16.0",
    "azure-mgmt-compute>=31.0.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "azure-mgmt-resource>=23.0.0",
]
aws = [
    "boto3>=1.35.0",
]
gcp = [
    "google-cloud-billing>=1.13.0",
    "google-cloud-compute>=1.19.0",
]
finops = [
    "prophet>=1.1.0",
    "pandas>=2.2.0",
]

[project.urls]
homepage = "https://github.com/magenta-asoar/magenta"
documentation = "https://magenta.security/docs"
source = "https://github.com/magenta-asoar/magenta"

[tool.magenta-soa]
service_catalog = "services/catalog.toml"
config_dir = "config/"
terraform_dir = "terraform/"
kubernetes_dir = "kubernetes/"

[tool.magenta-soa.agents]
agent_ops = {
    enabled = true,
    service = "mcp-agent-ops",
    port = 50060,
    transport = "grpc",
}
agent_orchestrator = {
    enabled = true,
    service = "mcp-orchestrator",
    port = 50061,
    transport = "grpc",
}
agent_finops = {
    enabled = true,
    service = "mcp-finops",
    port = 50062,
    transport = "http",
}

[tool.magenta-soa.finops]
enabled = true
daily_budget_usd = 200.00
monthly_budget_usd = 6000.00
anomaly_threshold = 0.2
rightsizing_enabled = true
tag_compliance_enabled = true

[tool.magenta-soa.multicloud]
primary = "azure"
secondary = "aws"
private_cloud = "vsphere"
edge = "k3s"
topology_type = "hybrid"
